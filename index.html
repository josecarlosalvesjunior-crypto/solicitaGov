<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

<title>SolicitaGov</title>
</head>

<body>
	<div class="tela-inicial">
	
		<div class="esquerda">
		
			<div class="logo">
				<img src="img/logo-solicitagov.png" alt="logo-solicitagov">
			</div>

			<h2>A plataforma que conecta órgãos públicos nos melhores fornecedores do Brasil.</h2>

			<div class="checks">
				<img src="img/check.png" alt="check">
				<h3>Segurança garantida</h3>
				<img src="img/check.png" alt="check">
				<h3>Processos transparentes</h3>
				<img src="img/check.png" alt="check">
				<h3>Fornecedores Verificados</h3>

			</div>

		</div>

		<div class="direita">
		
			<h1>Bem-vindo ao Solicita Gov</h1>
			<h4>Acesse o ambiente de compras e contratações públicas.</h4>

			<form action="principal.html" method="get" novalidate>

				<label for="email">E-mail:</label> 
				<input type="email" id="email" name="email"> 
				<label for="password">Senha:</label> 
				<input type="password" id="password" name="password">
				<button type="submit">Entrar</button>

			</form>

			<h3>
				Não tem cadastro? <span>Cadastre-se</span>
			</h3>
			<h4>Entrar como comprador</h4>
		
		</div>
	</div>

</body>
</html>
